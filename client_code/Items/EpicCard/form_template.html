<div class="pl-epic">
  <anvil-component type="Label" name="title" prop:role='["strong"]' bind:text="self.item['title']"></anvil-component>
  <anvil-component type="Label" name="meta" prop:role='["pl-em"]'></anvil-component>
  <div class="acts">
    <anvil-component type="Button" name="earlier" prop:text="Earlier quarter" prop:role='["btn", "btn-ghost", "btn-icon", "ic-back"]'></anvil-component>
    <anvil-component type="Button" name="later" prop:text="Later quarter" prop:role='["btn", "btn-ghost", "btn-icon", "ic-arrow"]'></anvil-component>
    <anvil-component type="Button" name="edit" prop:text="Edit" prop:role='["btn", "btn-ghost", "btn-icon", "ic-edit"]'></anvil-component>
  </div>
</div>
