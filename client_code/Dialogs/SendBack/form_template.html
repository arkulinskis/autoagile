<div class="ui">
  <anvil-component type="Label" name="title" prop:role='["dlg-title"]'></anvil-component>
  <anvil-component type="Label" name="text" prop:role='["fine-print"]'></anvil-component>
  <div class="ui-row sb-quick" role="group" aria-label="Common reasons">
    <anvil-component type="Button" name="q_tests" prop:text="+ tests missing" prop:role='["btn", "btn-sm", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="q_scope" prop:text="+ out of scope" prop:role='["btn", "btn-sm", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="q_criteria" prop:text="+ criteria not met" prop:role='["btn", "btn-sm", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="q_split" prop:text="+ too big, split it" prop:role='["btn", "btn-sm", "btn-ghost"]'></anvil-component>
  </div>
  <label class="ui-field"><span>What to fix</span><anvil-component type="TextArea" name="reason" prop:height="96" prop:placeholder="Be specific: the agent reads this before it tries again."></anvil-component></label>
  <div class="ui-row end">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="ok_button" prop:text="Send back" prop:role='["btn", "btn-primary", "ic-back"]'></anvil-component>
  </div>
</div>
