  <div class="ui-choices cs-choices">
    <anvil-component type="RadioButton" name="to_next" prop:text="To the next sprint" prop:group_name="carry" prop:value="next" prop:selected="true"></anvil-component>

  <div class="ui-row end">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
